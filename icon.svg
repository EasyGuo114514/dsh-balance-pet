<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Balance Pet">
  <defs>
    <radialGradient id="bp-sky" cx="0.3" cy="0.2" r="1">
      <stop offset="0" stop-color="#2b6fb8"/>
      <stop offset="1" stop-color="#123055"/>
    </radialGradient>
    <linearGradient id="bp-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0ff"/>
      <stop offset="1" stop-color="#4a9de0"/>
    </linearGradient>
    <linearGradient id="bp-coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#e8a55a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bp-sky)"/>
  <!-- chibi head -->
  <ellipse cx="30" cy="34" rx="18" ry="16" fill="url(#bp-body)"/>
  <ellipse cx="30" cy="34" rx="18" ry="16" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
  <!-- ears -->
  <path d="M16 22c-3-6-1-10 3-10 3 0 5 3 6 6z" fill="#4a9de0"/>
  <path d="M44 22c3-6 1-10-3-10-3 0-5 3-6 6z" fill="#4a9de0"/>
  <!-- eyes -->
  <ellipse cx="23" cy="33" rx="2.6" ry="3.2" fill="#10243d"/>
  <ellipse cx="37" cy="33" rx="2.6" ry="3.2" fill="#10243d"/>
  <circle cx="24" cy="31.6" r="1" fill="#ffffff"/>
  <circle cx="38" cy="31.6" r="1" fill="#ffffff"/>
  <!-- smile -->
  <path d="M27 40c2 2 4 2 6 0" fill="none" stroke="#10243d" stroke-width="1.6" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="19" cy="38" r="2.2" fill="#ff9d9d" fill-opacity="0.55"/>
  <circle cx="41" cy="38" r="2.2" fill="#ff9d9d" fill-opacity="0.55"/>
  <!-- coin: the balance motif -->
  <circle cx="49" cy="47" r="9" fill="url(#bp-coin)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
  <text x="49" y="51.5" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#7a4a12">¥</text>
</svg>
